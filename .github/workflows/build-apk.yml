name: Android build (manual or push)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install project Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-37' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Build arm64 shared-test APK
        run: |
          chmod +x gradlew
          bash BUILD-MOBILE-APK.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpvrx-community-arm64-debug
          path: app/build/outputs/apk/standard/debug/*arm64-v8a*.apk
          if-no-files-found: error
